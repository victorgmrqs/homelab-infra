---
- name: Atualização simples de pacotes
  hosts: all
  become: yes
  
  tasks:
    - name: Atualizar e fazer upgrade
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        autoclean: yes
    
    - name: Verificar se reboot é necessário
      stat:
        path: /var/run/reboot-required
      register: reboot_required
    
    - name: Avisar sobre reboot
      debug:
        msg: "⚠️  {{ inventory_hostname }} precisa de reboot!"
      when: reboot_required.stat.exists